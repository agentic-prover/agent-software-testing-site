# Rebuilds the published site from the latest release of the results repository and commits docs/, which GitHub Pages
# serves. The results repository starts this after each release. It can also be started by hand from the Actions tab.
name: Rebuild the site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-site
  cancel-in-progress: false

jobs:
  rebuild:
    name: Build, check and commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out the results
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/agent-software-testing-results
          ref: main
          path: _results
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Rebuild
        run: python scripts/rebuild.py _results
      - name: Commit what changed
        run: |
          set -eu
          git add docs site.json
          if git diff --cached --quiet; then
            echo "The site is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Rebuild for the latest results release"
          git push origin HEAD:main
